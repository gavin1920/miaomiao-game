name: Deploy game to GitHub Pages

on:
  push:
    branches: [master]
    paths: ['miaomiao-deploy/**', '.github/workflows/deploy-pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Remove legacy hosting config (surge.sh CNAME is not for Pages)
        run: rm -f miaomiao-deploy/CNAME
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: miaomiao-deploy
      - id: deployment
        uses: actions/deploy-pages@v4
